name: foursqr
version: "0.30.2"
slug: foursqr
description: Je hele woning in één overzicht. KNX herkennen, begrijpen en bedienen.
url: https://knx.foursqr.ai
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# Nodig om de KNX IP-interface in het eigen netwerk te vinden en te bereiken.
host_network: true
# Weer, energie en laadpaal lezen; lampen en schakelaars die op het dashboard staan aan of uit zetten.
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:home-outline
panel_title: foursqr
image: ghcr.io/foursqr/foursqr-addon-{arch}
